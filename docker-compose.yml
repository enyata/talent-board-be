services:
  postgres:
    image: postgres:17
    container_name: postgres-dev
    profiles: ["dev"]
    env_file: .env
    environment:
      POSTGRES_USER: ${TALENTS_DB_USER}
      POSTGRES_PASSWORD: ${TALENTS_DB_PASSWORD}
      POSTGRES_DB: ${TALENTS_DB_NAME}
    ports:
      - "5452:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    restart: always

  postgres_test:
    image: postgres:17
    container_name: postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: test_db
    ports:
      - "5453:5432"
    volumes:
      - ./data/test-db:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    profiles: ["dev", "test"]
    ports:
      - "6389:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: always

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "8090:8080"
    depends_on:
      - postgres
    restart: always
    profiles: ["dev"]

  adminer_prod:
    image: adminer:4.8.1
    container_name: adminer-prod
    ports:
      - "8084:8080"
    depends_on:
      - postgres
    restart: always
    profiles: ["dev"]

  maildev:
    image: maildev/maildev
    container_name: maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    restart: always
    profiles: ["dev"]

  backend:
    container_name: talentboard-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        - NODE_ENV=development
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      REDIS_HOST: redis
    command: yarn dev
    depends_on:
      - postgres
      - redis
      - maildev
    profiles: ["dev"]
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - data/
        - action: rebuild
          path: package.json


  backend_test:
    container_name: talentboard-backend-test
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=test
    environment:
      NODE_ENV: test
      IS_DOCKER: true
      DB_HOST: postgres_test
      REDIS_HOST: redis
    volumes:
      - .:/app
    command: yarn test
    depends_on:
      - postgres_test
      - redis
    profiles: ["test"]

  alloy:
    image: grafana/alloy:latest
    container_name: talentboard-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/cloud.alloy
    volumes:
      - ./observability/alloy/cloud.alloy:/etc/alloy/cloud.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    restart: unless-stopped

volumes:
  alloy_data:
  redis_data:
